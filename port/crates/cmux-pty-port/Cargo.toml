[package]
name = "cmux-pty-port"
version.workspace = true
edition.workspace = true

[dependencies]
portable-pty = "0.8.1" # pinned: 0.9.0 ConPTY Child::wait() hangs while the writer is held (wezterm regression, wezterm/wezterm#6783)
anyhow = "1"
# Job objects: the Windows container primitive for one pane's shell subtree
# (upstream ports its child-led process-group ownership to jobs; see
# `PaneJob`/ADR-0003).
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
cmux-testsupport = { path = "../cmux-testsupport" }
# Descendant discovery for the container tests (ToolHelp process snapshot).
windows = { version = "0.62.2", features = ["Win32_System_Diagnostics_ToolHelp"] }
